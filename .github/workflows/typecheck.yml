name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nusantara_star_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nusantara_star_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Tests (isolated PostgreSQL; no remote database)
        run: node --test test/*.test.mjs
      - name: PostgreSQL 17 multi-session reservation races
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nusantara_star_test
        run: bash test/postgres17-concurrency.sh
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
