name: Typecheck

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
